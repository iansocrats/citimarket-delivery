name: CitiMarket Delivery CI & Milestone Gatekeeper

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-quality-gates:
    name: Verify Milestone Invariants & Financial Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --if-present

      - name: Gate 1 - Validate Double-Entry Invariants & Distributed Tests
        run: npm test

      - name: Gate 2 - Validate Core Frontend & Script Syntax
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('index.html', 'utf8');
            const m = html.match(/<script>([\s\S]*?)<\/script>/);
            if (!m) throw new Error('No script tag found in index.html');
            new Function(m[1]);
            console.log('✅ index.html JavaScript syntax is 100% valid');
          "
