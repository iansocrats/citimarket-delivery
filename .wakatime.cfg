# CitiMarket Delivery - Developer Time & Blocker Telemetry Configuration
# Tracks coding velocity and alerts early when tasks exceed day estimates

[settings]
debug = false
hidefilenames = false
ignore =
    COMMIT_EDITMSG$
    TAG_EDITMSG$
    ^/var/(?!.*/citimarket-delivery/)
    ^/tmp/
    ^node_modules/

[project]
name = citimarket-delivery
branch = main
milestone_tracking = true
target_days = 56
alert_on_blocker_hours = 6
